<!-- JAVASCRIPT – fast prøve med 25 spørgsmål (DK) -->
<script>
// Fast sæt af 25 spørgsmål (fra din CSV); første svar i hver liste er det korrekte
const QUESTIONS = [
  {
    q: "Kan to personer fra to forskellige trossamfund blive gift i folkekirken?",

  },
  {

      "Ja"
    ]
  },
  {
    q: "Hvor ligger Danmarks tredjestørste by, Odense?",

      "På Fyn",

    ]
  },
  {

      "5",

      "7"
    ]
  },
  {

      "Ca. 550 meter"
    ]
  },
  {

    a: [

      "Folketinget og domstolene"
    ]
  },
  {
    q: "Hvor gammel skal man være for at blive gift i Danmark?",
    a: [
      "Mindst 18 år",
      "Mindst 15 år",
      "Mindst 21 år"
    ]
  },
  {
    q: "Hvad er Karen Blixen især kendt for?",
    a: [
      "Hun skrev bøger",
      "Hun lavede billedkunst",
      "Hun spillede teater"
    ]
  },
  {
    q: "Hvornår blev protestantismen indført i Danmark?",
    a: [
      "I 1500-tallet",
      "I 1100-tallet",
      "I 1300-tallet"
    ]
  },
  {
    q: "Hvad hedder farvandet mellem Fyn og Sjælland?",
    a: [
      "Storebælt",
      "Øresund",
      "Lillebælt"
    ]
  },
  {
    q: "Hvem har den dømmende magt?",
    a: [
      "Domstolene",
      "Folketinget",
      "Regeringen"
    ]
  },
  {
    q: "Hvad er P.S. Krøyer særlig kendt for?",
    a: [
      "Han var kunstmaler",
      "Han var videnskabsmand",
      "Han var politiker"
    ]
  },
  {
    q: "Skal man være medlem af folkekirken for at blive begravet på en af folkekirkens kirkegårde?",
    a: [
      "Nej",
      "Ja"
    ]
  },
  {
    q: "For hvilken film vandt Thomas Vinterberg en Oscar i 2021?",
    a: [

      "Pelle Erobreren",

  },
  {

    a: [

    ]
  },
  {

  },
  {

  },

  },
  {
    q: "Hvad fremstiller den danske virksomhed LEGO?",
    a: [

  },
  {
    q: "Hvilket år blev Danmark besat af tyske tropper?",
    a: [

    ]
  },
  {
    q: "Hvornår er man ifølge loven myndig i Danmark?",
    a: [
      "Når man fylder 18 år",

      "Når man fylder 21 år"
    ]
  },
  {
    q: "Skal politiet normalt give tilladelse til, at man afholder en demonstration?",
    a: [
      "Nej",
      "Ja"
    ]
  },
  {
    q: "Hvad var Yahya Hassan særligt kendt for?",
    a: [
      "Han var digter",
      "Han var skuespiller",
      "Han var fodboldspiller"
    ]
  },
  {
    q: "I hvilken type institution går børn typisk, når de er fire år",
    a: [
      "Børnehave",
      "Vuggestue"
    ]
  }
];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Model med korrekt svar markeret, men valgmulighederne blandes
const model = QUESTIONS.map((item, idx) => {
  const correct = item.a[0];
  const shuffled = shuffle(item.a);
  return {
    index: idx,
    text: item.q,
    choices: shuffled.map(opt => ({ text: opt, isCorrect: opt === correct })),
    answered: false,
    pickedIndex: -1
  };
});

const qTitle = document.getElementById('qTitle');
const choicesEl = document.getElementById('choices');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const progressLabel = document.getElementById('progressLabel');
const resultPanel = document.getElementById('resultPanel');
const gradeStamp = document.getElementById('gradeStamp');
const resultText = document.getElementById('resultText');
const timerEl = document.getElementById('timer');

let qi = 0, score = 0;
const total = model.length;

// 30 minutter (officiel prøve)
let timerSec = 30 * 60;

const timerInt = setInterval(() => {
  timerSec--;
  if (timerSec < 0) {
    clearInterval(timerInt);
    finishTest();
    return;
  }
  const m = Math.floor(timerSec / 60).toString().padStart(2, '0');
  const s = (timerSec % 60).toString().padStart(2, '0');
  timerEl.textContent = `${m}:${s}`;
}, 1000);

function renderQuestion() {
  const q = model[qi];
  qTitle.textContent = q.text;
  choicesEl.innerHTML = '';
  q.choices.forEach((c, idx) => {
    const btn = document.createElement('button');
    btn.className = 'choice' + (q.answered ? ' disabled' : '');
    btn.textContent = c.text;
    btn.addEventListener('click', () => pick(idx));
    choicesEl.appendChild(btn);
  });

  btnPrev.disabled = (qi === 0);
  btnNext.disabled = !q.answered;

  progressLabel.textContent = `Spørgsmål ${qi + 1} af ${total} · Point ${score}`;

  if (q.answered) applyRevealStyles();

  if (qi === total - 1) btnNext.textContent = "Se resultat →";
  else btnNext.textContent = "Næste →";
}

function pick(idx) {
  const q = model[qi];
  if (q.answered) return;

  q.answered = true;
  q.pickedIndex = idx;

  if (q.choices[idx].isCorrect) score++;

  applyRevealStyles();

  btnNext.disabled = false;
  progressLabel.textContent = `Spørgsmål ${qi + 1} af ${total} · Point ${score}`;

  if (qi === total - 1) btnNext.textContent = "Se resultat →";
}

function applyRevealStyles() {
  const q = model[qi];
  const buttons = choicesEl.querySelectorAll('.choice');
  buttons.forEach((b, i) => {
    b.classList.add('disabled');
    if (q.choices[i].isCorrect) b.classList.add('correct');
    if (q.pickedIndex === i && !q.choices[i].isCorrect) b.classList.add('wrong');
  });
}

btnNext.addEventListener('click', () => {
  if (qi < total - 1) {
    qi++;
    renderQuestion();
  } else {
    finishTest();
  }
});

btnPrev.addEventListener('click', () => {
  if (qi > 0) {
    qi--;
    renderQuestion();
  }
});

function finishTest() {
  clearInterval(timerInt);
  document.querySelector('.question-card').style.display = 'none';
  resultPanel.style.display = 'block';

  const wrong = total - score;

  // Officiel grænse: 20/25 for bestået
  const pass = score >= 20;

  gradeStamp.textContent = pass ? "Bestået!" : "Ikke bestået";
  gradeStamp.className = "result-stamp " + (pass ? "pass" : "fail");

  resultText.textContent =
    `Slutscore: ${score} / ${total} (${Math.round(score / total * 100)} %). ` +
    `Korrekte svar: ${score}. Forkerte svar: ${wrong}.`;

  renderChart(score, wrong);
}

function renderChart(correct, wrong) {
  const ctx = document.getElementById('resultChart').getContext('2d');
  new Chart(ctx, {
    type: 'pie',
    data: {
      labels: ['Korrekte', 'Forkerte'],
      datasets: [{ data: [correct, wrong] }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { position: 'bottom' },
        title: { display: true, text: 'Fordeling af svar' }
      }
    }
  });
}

renderQuestion();
</script>
