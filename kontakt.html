  <link rel="canonical" href="https://medborgerskabsprove.dk/kontakt">

  <!-- ===============================
       OPEN GRAPH
  ================================== -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="da_DK">
  <meta property="og:title" content="Kontakt – Medborgerskabsprøven">
  <meta property="og:description"
    content="Har du spørgsmål om medborgerskabsprøven eller vores online træning? Kontakt os – vi hjælper gerne.">
  <meta property="og:url" content="https://medborgerskabsprove.dk/kontakt">
  <meta property="og:image" content="https://medborgerskabsprove.dk/assets/images/og-default.jpg">

  <!-- ===============================
       TWITTER CARDS
  ================================== -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Kontakt – Medborgerskabsprøven">
  <meta name="twitter:description"
    content="Få support eller svar på dine spørgsmål om medborgerskabsprøven og vores træningsplatform.">
  <meta name="twitter:image" content="https://medborgerskabsprove.dk/assets/images/og-default.jpg">



  <link rel="stylesheet" href="/assets/css/shared.css">
  <link rel="stylesheet" href="/assets/css/contact.css">
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Inline success/error message styles -->
  <style>
    .contact-feedback {
      display: none;
      margin-top: 1rem;
      font-size: 1rem;
      padding-left: 0.2rem;
    }
    .contact-feedback.success { color: #1b7f3b; }
    .contact-feedback.error { color: #b71c1c; }
  </style>

</head>

<body>

<header class="site-header">
  <div class="header-inner">

    <div class="header-left">
      <a href="/" class="brand-link">
        <img src="/assets/images/dk.svg" alt="Danmark">
        <div class="brand-title">Medborgerskabsprove.dk</div>
      </a>
    </div>

    <div class="header-center">
      <nav class="header-nav">
        <a href="/test-gratis.html">Gratis test</a>
        <a href="/kontakt.html">Kontakt</a>
		<a href="https://civiclearn.com/denmark-pr/login">Login</a>
      </nav>
    </div>

    <div class="header-right">
      <div class="brand-powered">drevet af <span>CivicLearn</span></div>
      <a href="https://civiclearn.com/denmark-pr/checkout.html" class="btn-small-purple">Få fuld adgang</a>
    </div>

  </div>
</header>


<!-- MAIN CONTENT -->
<main class="contact-main">

  <h1 class="contact-title">Kontakt</h1>

  <div class="contact-card">

    <!-- AJAX Formspree contact form -->
    <form id="contactForm" class="contact-form">

      <div class="field">
        <label>Navn*</label>
        <input type="text" name="name" required>
      </div>

      <div class="field">
        <label>E-mail*</label>
        <input type="email" name="_replyto" required>
      </div>

      <div class="field">
        <label>Besked*</label>
        <textarea name="message" required></textarea>
      </div>

      <button type="submit" class="contact-submit">Send beskeden</button>

      <!-- Success & error messages -->
      <div id="successMessage" class="contact-feedback success">
        Din besked er sendt.
      </div>

      <div id="errorMessage" class="contact-feedback error">
        Der opstod en fejl. Prøv igen.
      </div>

    </form>

  </div>

</main>


<!-- FOOTER -->
<footer class="cl-footer">
  <div class="cl-footer-inner">
    © 2026 <span class="cl-footer-brand">CivicLearn</span> — Alle rettigheder forbeholdes.
  </div>
</footer>


<!-- AJAX LOGIC: NO REDIRECT -->
<script>
document.getElementById("contactForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const form = e.target;
  const data = new FormData(form);

  const success = document.getElementById("successMessage");
  const error = document.getElementById("errorMessage");

  success.style.display = "none";
  error.style.display = "none";

  try {
    const response = await fetch("https://formspree.io/f/xjknabek", {
      method: "POST",
      body: data,
      headers: { "Accept": "application/json" }
    });

    if (response.ok) {
      success.style.display = "block";
      form.reset();
    } else {
      error.style.display = "block";
    }

  } catch {
    error.style.display = "block";
  }
});
</script>

</body>
</html>
